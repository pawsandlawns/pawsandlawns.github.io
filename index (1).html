<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pawsandlawns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: single narrow column, big tappable product rows, like a field-guide index card */
:root {
  --bg: #eef3e6;
  --surface: #ffffff;
  --ink: #17301f;
  --muted: #566b5b;
  --line: #d3dfc6;
  --accent: #2f7d3b;
  --accent-ink: #ffffff;
  --sun: #f2c230;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1d14; --surface: #172a1d; --ink: #e8f2e0; --muted: #9db3a2;
    --line: #25402d; --accent: #6fcf7d; --accent-ink: #0f1d14; --sun: #f2c230;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1d14; --surface: #172a1d; --ink: #e8f2e0; --muted: #9db3a2;
  --line: #25402d; --accent: #6fcf7d; --accent-ink: #0f1d14; --sun: #f2c230;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 40px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.mark {
  width: 76px; height: 76px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 30px;
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--sun);
}
h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.1; margin: 8px 0 0; letter-spacing: -0.01em; }
.tag { margin: 0; color: var(--muted); max-width: 32ch; text-wrap: balance; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.search {
  width: 100%; margin: 0 0 12px; padding: 13px 16px;
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px;
}
.search::placeholder { color: var(--muted); }
.search:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.empty { margin: 12px 0 0; text-align: center; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
a.item {
  display: flex; align-items: center; gap: 14px;
  min-width: 0; padding: 14px 16px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 14px;
  text-decoration: none;
  transition: transform .12s ease, border-color .12s ease;
}
a.item:hover { border-color: var(--accent); transform: translateY(-1px); }
a.item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.badge {
  flex: none; width: 44px; height: 44px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--line);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; color: var(--accent);
}
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.name { font-weight: 700; overflow-wrap: anywhere; }
.note { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.go { flex: none; font-weight: 700; color: var(--accent); font-size: 14px; }
.top .badge { background: var(--sun); border-color: var(--sun); color: #17301f; }
footer { text-align: center; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
footer p { margin: 0; }
@media (prefers-reduced-motion: reduce) { a.item { transition: none; } }
</style>

</head>
<body>
<main>
  <header>
    <div class="mark" aria-hidden="true">P&amp;L</div>
    <h1>pawsandlawns</h1>
    <p class="tag">Gear for dogs and the yards they trash. Every product from my videos is below.</p>
  </header>

  <section aria-labelledby="picks">
    <p class="label" id="picks">Products from my videos</p>
    <input id="search" class="search" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off">
    <ul id="list"></ul>
    <p class="note empty" id="empty" hidden>No product found. Try another word.</p>
  </section>

  <footer>
    <p>As an Amazon Associate I earn from qualifying purchases.</p>
    <p>Tap a product to see the price on Amazon.</p>
  </footer>
</main>

<script>
/* Edit this list: name, note, url. Put your own Amazon affiliate link in url. */
var products = [
  { name: "Orthopedic dog couch bed", note: "Egg crate foam, waterproof lining, free tennis ball", url: "https://link.amazon/B048WwCYZ", top: true },
  { name: "Dog back seat cover", note: "As seen in my latest video", url: "https://link.amazon/B0fw3NBgs" }
];
var list = document.getElementById("list");
var search = document.getElementById("search");
var empty = document.getElementById("empty");
function render(q) {
  q = q.trim().toLowerCase();
  list.innerHTML = "";
  var shown = 0;
  products.filter(function (p) {
    return (p.name + " " + p.note).toLowerCase().indexOf(q) !== -1;
  }).forEach(function (p) {
  var li = document.createElement("li");
  var a = document.createElement("a");
  a.className = "item" + (p.top ? " top" : "");
  a.href = p.url;
  a.target = "_blank";
  a.rel = "noopener sponsored";
  var b = document.createElement("span"); b.className = "badge"; b.textContent = p.name.charAt(0);
  var t = document.createElement("span"); t.className = "txt";
  var n = document.createElement("span"); n.className = "name"; n.textContent = p.name;
  var d = document.createElement("span"); d.className = "note"; d.textContent = p.note;
  t.appendChild(n); t.appendChild(d);
  var g = document.createElement("span"); g.className = "go"; g.textContent = "Shop";
  a.appendChild(b); a.appendChild(t); a.appendChild(g);
  li.appendChild(a); list.appendChild(li); shown++;
  });
  empty.hidden = shown > 0;
}
render("");
search.addEventListener("input", function () { render(search.value); });
</script>
</body>
</html>
